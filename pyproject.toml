[project]
name = "industrial-defect-detection"
version = "0.1.0"
description = "Industrial visual anomaly detection with MVTec AD"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

# Avoid non-ASCII paths in .pth files on Python 3.11 / Windows.
[tool.hatch.build]
dev-mode-exact = true

[tool.hatch.build.targets.wheel]
packages = ["src/defect_detection"]

[dependency-groups]
# Runtime helper for Hatch's exact editable import mode.
dev = ["editables>=0.5", "pytest>=8", "ruff>=0.9"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
