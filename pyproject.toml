[project]
name = "industrial-defect-detection"
version = "0.1.0"
description = "Industrial visual anomaly detection with MVTec AD"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anomalib>=2.7.1",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.1.0.95",
    "pyyaml>=6.0.3",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

# Avoid non-ASCII paths in .pth files on Python 3.11 / Windows.
[tool.hatch.build]
dev-mode-exact = true

[tool.hatch.build.targets.wheel]
packages = ["src/defect_detection"]

[dependency-groups]
# Runtime helper for Hatch's exact editable import mode.
dev = ["editables>=0.5", "pytest>=8", "ruff>=0.9"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

# CUDA-enabled PyTorch packages on Windows and Linux.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
